spring:
  application:
    name: ordercontext-api
  datasource:
    url: jdbc:h2:mem:ordercontext;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
  h2:
    console:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  # Used to decide "today" (delivery dates, daysUntilDelivery)
  time-zone: America/Mexico_City
  seed:
    enabled: true
